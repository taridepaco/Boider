<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Boider</title>
    <meta name="description" content="Simulación interactiva de bandadas (boids de Craig Reynolds).">
    <meta name="theme-color" content="#bfe3d6">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script>
        // idioma antes del primer pintado: ?lang=, luego la última elección, luego el navegador
        (function () {
            var l = null;
            try {
                var q = new URLSearchParams(location.search).get("lang"), s = null;
                try { s = localStorage.getItem("taridepaco-lang"); } catch (e) { /* sin almacenamiento */ }
                var n = (navigator.languages && navigator.languages[0]) || navigator.language || "";
                l = q || s || (/^es/i.test(n) ? "es" : "en");
            } catch (e) { /* navegador antiguo */ }
            document.documentElement.lang = l === "en" ? "en" : "es";
        })();
    </script>
    <script src="theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Martian+Mono:wght@500;700&display=swap">
    <link rel="stylesheet" href="system.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.5.0/p5.min.js"></script>
    <script src="params.js"></script>
    <script src="grid.js"></script>
    <script src="boid.js"></script>
    <script src="obstacle.js"></script>
    <script src="render.js"></script>
    <script src="ui.js"></script>
</head>
<body>
    <header class="topbar">
        <a class="util back" href="https://taridepaco.github.io/"><span class="back-arrow" aria-hidden="true">←</span><span class="back-text"> taridepaco</span></a>
        <h1>Boider</h1>
        <span class="tag" data-i18n="kind">Simulador</span>
        <button class="chip theme-btn" type="button">Tema: auto</button>
        <div class="lang-switch" role="group" aria-label="Language / Idioma">
            <button type="button" data-lang="es" lang="es" aria-label="Español" aria-pressed="true">ES</button>
            <button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
        </div>
    </header>
    <div class="app">
        <details id="panel" open>
            <summary><span class="util" data-i18n="panel">Controles</span></summary>
            <script>
                // phones and low screens (landscape phones) start with the panel folded, before the first paint
                if (window.matchMedia && matchMedia("(max-width: 720px), (max-height: 500px)").matches) document.getElementById("panel").open = false;
            </script>
            <!-- built by ui.js -->
            <div id="controls"></div>
        </details>
        <div class="deck" role="group" data-i18n-label="deck" aria-label="Mandos principales">
            <!-- one short word each, so the three fit in a row on any phone; the full label is the title -->
            <button class="btn" type="button" data-act="reset" data-i18n="deck.reset" data-i18n-title="b.reset" title="Reiniciar boids">Reiniciar</button>
            <button class="btn ghost" type="button" data-act="clear" data-i18n="deck.clear" data-i18n-title="b.clear" title="Quitar obstáculos">Despejar</button>
            <button class="btn ghost" type="button" data-act="defaults" data-i18n="deck.defaults" data-i18n-title="b.defaults" title="Valores por defecto">Restaurar</button>
        </div>
        <main class="screen">
            <!-- render.js puts the p5 canvas here -->
            <div id="canvasContainer" class="stage" role="img" data-i18n-label="board" aria-label="Bandada de boids"></div>
            <div id="stats" class="status" aria-live="off">&nbsp;</div>
        </main>
    </div>
</body>
</html>
